<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gia phả họ Phạm Đình — xã Hà Bắc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --giay:#F7F3E9;          /* nen giay ngà */
    --giay-dam:#EFE8D8;
    --muc:#241E18;           /* muc nau den */
    --muc-nhat:#6B5F52;
    --son:#9B2226;           /* son do - dau trieu */
    --son-nhat:#C4494D;
    --vien:#D8CDB6;
    --nhan:#B08C3F;          /* nhu vang dong */
    --song:#2F5D50;          /* xanh reu - nguoi con song */
    --r:3px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--giay);
    color:var(--muc);
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    font-size:16px;line-height:1.6;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(176,140,63,.035) 0, transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(155,34,38,.025) 0, transparent 50%);
    min-height:100vh;
  }
  .khung{max-width:920px;margin:0 auto;padding:0 20px}

  /* ---- Dau trang ---- */
  header{
    border-bottom:2px solid var(--muc);
    padding:34px 0 22px;margin-bottom:8px;position:relative;
  }
  header::after{
    content:'';position:absolute;left:0;right:0;bottom:-6px;
    height:1px;background:var(--muc);
  }
  .dai-tu{
    font-family:'Noto Serif',serif;font-weight:700;
    font-size:clamp(1.7rem,4.5vw,2.5rem);
    letter-spacing:.02em;line-height:1.25;
  }
  .dai-tu .ho{color:var(--son)}
  .phu-de{
    color:var(--muc-nhat);font-size:.9rem;margin-top:8px;
    display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  }
  .phu-de b{color:var(--muc);font-weight:600}

  /* ---- Thanh tim kiem ---- */
  .thanh-tim{
    position:sticky;top:0;z-index:50;
    background:var(--giay);
    padding:16px 0 12px;
    border-bottom:1px solid var(--vien);
    margin-bottom:24px;
  }
  .o-tim{position:relative}
  .o-tim input{
    width:100%;padding:13px 15px 13px 44px;
    font-family:inherit;font-size:1.02rem;
    background:#fff;color:var(--muc);
    border:1.5px solid var(--vien);border-radius:var(--r);
    outline:none;transition:border-color .15s;
  }
  .o-tim input:focus{border-color:var(--son)}
  .o-tim input::placeholder{color:#A99C8B}
  .o-tim svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--muc-nhat);fill:none;stroke-width:2;
  }
  .goi-y{
    font-size:.82rem;color:var(--muc-nhat);margin-top:7px;
  }

  /* ---- Bo loc doi ---- */
  .loc{
    display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;
  }
  .loc button{
    font-family:inherit;font-size:.8rem;
    padding:5px 11px;cursor:pointer;
    background:transparent;color:var(--muc-nhat);
    border:1px solid var(--vien);border-radius:var(--r);
    transition:all .13s;
  }
  .loc button:hover{border-color:var(--muc-nhat);color:var(--muc)}
  .loc button[aria-pressed="true"]{
    background:var(--muc);color:var(--giay);border-color:var(--muc);
  }

  /* ---- Danh sach ---- */
  .dem{font-size:.85rem;color:var(--muc-nhat);margin-bottom:14px}
  .doi-nhom{margin-bottom:30px}
  .doi-tieu{
    font-family:'Noto Serif',serif;font-size:.95rem;font-weight:600;
    color:var(--son);letter-spacing:.08em;text-transform:uppercase;
    padding-bottom:6px;margin-bottom:12px;
    border-bottom:1px solid var(--vien);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .doi-tieu span{
    font-family:'Be Vietnam Pro',sans-serif;font-size:.78rem;
    color:var(--muc-nhat);font-weight:400;letter-spacing:0;text-transform:none;
  }
  .luoi{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;
  }
  .the{
    text-align:left;font-family:inherit;cursor:pointer;
    background:#fff;border:1px solid var(--vien);border-radius:var(--r);
    padding:11px 13px;transition:all .13s;
    border-left:3px solid var(--vien);
  }
  .the:hover{border-color:var(--nhan);border-left-color:var(--son);transform:translateX(2px)}
  .the.tt-con_song{border-left-color:var(--song)}    /* xanh reu — con song */
  .the.tt-chua_ro {border-left-color:var(--nhan)}    /* vang dong — chua ro */
  .the.tt-da_mat  {border-left-color:var(--vien)}    /* xam nhat — da mat */
  .the.dau-re{background:var(--giay-dam)}
  .the-ten{font-weight:600;font-size:.95rem;line-height:1.35}
  .the-phu{font-size:.78rem;color:var(--muc-nhat);margin-top:3px}
  .the-mat{
    font-size:.75rem;color:var(--son);margin-top:2px;
    letter-spacing:.01em;
  }
  .nhan-dau-re{
    display:inline-block;font-size:.66rem;padding:1px 5px;
    background:var(--nhan);color:#fff;border-radius:2px;
    margin-left:5px;vertical-align:middle;letter-spacing:.03em;
  }

  .rong{
    text-align:center;padding:50px 20px;color:var(--muc-nhat);
    font-family:'Noto Serif',serif;font-style:italic;
  }

  /* ---- Trang ca nhan ---- */
  .man-ca-nhan{display:none}
  body.dang-xem .man-ca-nhan{display:block}
  body.dang-xem .man-danh-sach{display:none}

  .quay-lai{
    background:none;border:none;font-family:inherit;cursor:pointer;
    color:var(--muc-nhat);font-size:.88rem;padding:6px 0;margin-bottom:14px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .quay-lai:hover{color:var(--son)}

  .duong-doi{
    font-size:.82rem;color:var(--muc-nhat);
    padding:11px 14px;margin-bottom:20px;
    background:var(--giay-dam);border-radius:var(--r);
    border-left:3px solid var(--nhan);
    line-height:1.85;
  }
  .duong-doi a{
    color:var(--muc-nhat);text-decoration:none;
    border-bottom:1px dotted var(--muc-nhat);cursor:pointer;
  }
  .duong-doi a:hover{color:var(--son);border-color:var(--son)}
  .duong-doi .day{color:var(--vien);margin:0 5px;border:none}
  .duong-doi b{color:var(--muc);font-weight:600;border:none}

  .hs-dau{
    display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:20px;
    border-bottom:2px solid var(--muc);
  }
  .hs-ten{
    font-family:'Noto Serif',serif;font-weight:700;
    font-size:clamp(1.45rem,4vw,2rem);line-height:1.25;
  }
  .hs-meta{
    margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    font-size:.86rem;color:var(--muc-nhat);
  }
  .vien-nho{
    padding:2px 9px;border:1px solid var(--vien);border-radius:2px;
    background:#fff;
  }
  .vien-nho.doi{border-color:var(--son);color:var(--son);font-weight:600}
  .vien-nho.song{border-color:var(--song);color:var(--song)}
  .vien-nho.chua-ro{border-color:var(--nhan);color:var(--nhan)}
  .vien-nho.mat{border-color:var(--muc-nhat);color:var(--muc-nhat)}

  .khoi{margin-bottom:22px}
  .khoi-tieu{
    font-family:'Noto Serif',serif;font-size:.82rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--son);
    margin-bottom:9px;
  }
  .hang{
    display:flex;gap:10px;padding:9px 0;
    border-bottom:1px dashed var(--vien);font-size:.93rem;
  }
  .hang:last-child{border:none}
  .hang-nhan{
    min-width:112px;color:var(--muc-nhat);font-size:.86rem;flex-shrink:0;
  }
  .lien{
    color:var(--muc);text-decoration:none;cursor:pointer;
    border-bottom:1px solid var(--vien);
  }
  .lien:hover{color:var(--son);border-color:var(--son)}
  .lien + .lien{margin-left:0}
  .ds-lien{display:flex;flex-direction:column;gap:5px}

  .thieu{color:#B4A794;font-style:italic;font-size:.88rem}

  .ngay-gio{
    color:var(--son);font-weight:600;
  }

  footer{
    margin-top:50px;padding:20px 0 40px;
    border-top:1px solid var(--vien);
    font-size:.8rem;color:var(--muc-nhat);
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  footer a{color:var(--son);text-decoration:none;border-bottom:1px solid transparent}
  footer a:hover{border-color:var(--son)}

  mark{background:#F5E6A8;color:var(--muc);padding:0 1px;border-radius:2px}

  @media (max-width:600px){
    .luoi{grid-template-columns:1fr}
    .hang{flex-direction:column;gap:2px}
    .hang-nhan{min-width:0;font-size:.78rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<div class="khung">

  <header>
    <div class="dai-tu">Gia phả <span class="ho">họ Phạm Đình</span></div>
    <div class="phu-de">
      <span>xã Hà Bắc</span>
      <span>·</span>
      <span><b id="tong-nguoi">—</b> người</span>
      <span>·</span>
      <span><b id="tong-doi">—</b> đời</span>
      <span>·</span>
      <span>Thủy tổ: <b id="thuy-to">—</b></span>
    </div>
  </header>

  <!-- ====== MÀN DANH SÁCH ====== -->
  <div class="man-danh-sach">

    <div class="thanh-tim">
      <div class="o-tim">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="tim" type="search" placeholder="Tìm theo tên — gõ có dấu hoặc không dấu đều được"
               autocomplete="off" spellcheck="false">
      </div>
      <div class="goi-y">Ví dụ: gõ <b>ha</b> ra <b>Hà</b> · gõ <b>pham dinh</b> ra <b>Phạm Đình</b></div>
      <div class="loc" id="loc"></div>
    </div>

    <div class="dem" id="dem"></div>
    <div id="ket-qua"></div>

  </div>

  <!-- ====== MÀN CÁ NHÂN ====== -->
  <div class="man-ca-nhan" id="man-ca-nhan"></div>

  <footer>
    <div>Gia phả họ Phạm Đình · Cập nhật từ dữ liệu gia phả</div>
    <div><a href="#" id="mo-so-do">Xem sơ đồ cây →</a></div>
  </footer>

</div>

<script>
// ============ Dữ liệu ============
let DL = null;
let LOC_DOI = 0;        // 0 = tất cả
let TU_KHOA = '';

const $ = s => document.querySelector(s);
const LAMA = ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII',
              'XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX',
              'XXI','XXII','XXIII','XXIV','XXV'];

// Bỏ dấu — phải khớp đúng với hàm bo_dau() bên Python
function boDau(s){
  return s.replace(/Đ/g,'D').replace(/đ/g,'d')
          .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .toLowerCase();
}

// ============ Nạp ============
fetch('data.json')
  .then(r=>{ if(!r.ok) throw new Error('Không đọc được data.json'); return r.json(); })
  .then(d=>{ DL=d; khoiDong(); })
  .catch(e=>{
    $('#ket-qua').innerHTML =
      '<div class="rong">Không nạp được dữ liệu.<br><small>'+e.message+'</small></div>';
  });

function khoiDong(){
  const ng = Object.values(DL.nguoi);
  const maxDoi = Math.max(...ng.map(p=>p.doi));
  const goc = ng.filter(p=>p.doi===1 && p.huyet_thong);

  $('#tong-nguoi').textContent = ng.length;
  $('#tong-doi').textContent   = maxDoi;
  $('#thuy-to').textContent    = goc.length ? goc[0].ten : '—';

  // nút lọc theo đời
  const loc = $('#loc');
  loc.innerHTML = '';
  loc.appendChild(nutLoc('Tất cả', 0));
  for(let d=1; d<=maxDoi; d++){
    const n = ng.filter(p=>p.doi===d).length;
    if(n) loc.appendChild(nutLoc('Đời '+d, d));
  }

  $('#tim').addEventListener('input', e=>{
    TU_KHOA = boDau(e.target.value.trim());
    ve();
  });

  window.addEventListener('hashchange', dinhTuyen);
  dinhTuyen();
}

function nutLoc(nhan, doi){
  const b = document.createElement('button');
  b.textContent = nhan;
  b.setAttribute('aria-pressed', doi===LOC_DOI);
  b.onclick = ()=>{
    LOC_DOI = doi;
    [...$('#loc').children].forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    ve();
  };
  return b;
}

// ============ Danh sách ============
function ve(){
  const ng = Object.values(DL.nguoi);
  let kq = ng;

  if(TU_KHOA) kq = kq.filter(p=>p.tim.includes(TU_KHOA));
  if(LOC_DOI) kq = kq.filter(p=>p.doi===LOC_DOI);

  const dem = $('#dem');
  if(!kq.length){
    dem.textContent = '';
    $('#ket-qua').innerHTML =
      '<div class="rong">Không tìm thấy ai khớp với “'+$('#tim').value+'”.<br>'+
      '<small>Thử gõ ngắn hơn, hoặc bỏ dấu.</small></div>';
    return;
  }

  dem.textContent = TU_KHOA
    ? 'Tìm thấy '+kq.length+' người'
    : (LOC_DOI ? kq.length+' người ở đời '+LOC_DOI : 'Toàn bộ '+kq.length+' người, xếp theo đời');

  // nhóm theo đời
  const nhom = {};
  kq.forEach(p=>{ (nhom[p.doi] ||= []).push(p); });

  const out = [];
  Object.keys(nhom).map(Number).sort((a,b)=>a-b).forEach(d=>{
    const ds = nhom[d].sort((a,b)=>a.ten.localeCompare(b.ten,'vi'));
    const ht = ds.filter(p=>p.huyet_thong).length;
    const dr = ds.length - ht;
    out.push(
      '<div class="doi-nhom">'+
        '<div class="doi-tieu">Đời '+(LAMA[d]||d)+
          '<span>'+ht+' con cháu'+(dr? ' · '+dr+' dâu/rể':'')+'</span>'+
        '</div>'+
        '<div class="luoi">'+ ds.map(theNguoi).join('') +'</div>'+
      '</div>'
    );
  });
  $('#ket-qua').innerHTML = out.join('');
}

function theNguoi(p){
  const cls = ['the', 'tt-'+(p.trang_thai || 'con_song')];
  if(!p.huyet_thong) cls.push('dau-re');

  const namSinh = p.sinh ? p.sinh.match(/\d{4}/)?.[0] : null;
  const namMat  = p.mat  ? p.mat.match(/\d{4}/)?.[0]  : null;

  // Dong 1: khoang nam, gon de quet nhanh trong danh sach 166 nguoi
  let phu;
  if(namSinh && namMat)   phu = namSinh+'–'+namMat;
  else if(namSinh)        phu = 'Sinh '+namSinh;
  else if(namMat)         phu = 'Mất '+namMat;
  else if(p.trang_thai === 'da_mat')
                          phu = '<span class="thieu">không rõ năm sinh, năm mất</span>';
  else                    phu = '<span class="thieu">chưa rõ năm sinh</span>';

  // Dong 2: ngay gio DAY DU (chi khi co ngay/thang, khong chi moi nam)
  let ngayMat = '';
  if(p.mat && /\d{1,2}\/\d{1,2}\//.test(p.mat)){
    ngayMat = '<div class="the-mat">Giỗ '+esc(p.mat)+'</div>';
  }

  const dr = p.huyet_thong ? '' :
    '<span class="nhan-dau-re">'+(p.gioi==='F'?'dâu':'rể')+'</span>';

  return '<button class="'+cls.join(' ')+'" onclick="moNguoi(\''+p.id+'\')">'+
           '<div class="the-ten">'+toSang(p.ten)+dr+'</div>'+
           '<div class="the-phu">'+phu+'</div>'+
           ngayMat+
         '</button>';
}

// tô sáng phần khớp từ khoá
function toSang(ten){
  if(!TU_KHOA) return esc(ten);
  const kd = boDau(ten);
  const i = kd.indexOf(TU_KHOA);
  if(i < 0) return esc(ten);
  return esc(ten.slice(0,i)) + '<mark>' + esc(ten.slice(i, i+TU_KHOA.length)) +
         '</mark>' + esc(ten.slice(i+TU_KHOA.length));
}
function esc(s){
  return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// ============ Trang cá nhân ============
function moNguoi(id){ location.hash = id; }

function dinhTuyen(){
  const id = location.hash.slice(1);
  if(id && DL.nguoi[id]){
    veCaNhan(DL.nguoi[id]);
    document.body.classList.add('dang-xem');
    window.scrollTo(0,0);
  }else{
    document.body.classList.remove('dang-xem');
    ve();
  }
}

function veCaNhan(p){
  const N = DL.nguoi;

  // đường từ thủy tổ xuống
  const duong = p.duong.map((x,i,arr)=>{
    const nx = N[x]; if(!nx) return '';
    const cuoi = i === arr.length-1;
    return cuoi
      ? '<b>'+esc(nx.ten)+'</b>'
      : '<a onclick="moNguoi(\''+x+'\')">'+esc(nx.ten)+'</a>';
  }).filter(Boolean).join('<span class="day">›</span>');

  // ngày tháng
  const meta = [];
  meta.push('<span class="vien-nho doi">Đời '+(LAMA[p.doi]||p.doi)+'</span>');
  meta.push('<span class="vien-nho">'+(p.gioi==='M'?'Nam':p.gioi==='F'?'Nữ':'—')+'</span>');
  if(!p.huyet_thong) meta.push('<span class="vien-nho">'+(p.gioi==='F'?'Con dâu':'Con rể')+'</span>');
  if(p.trang_thai === 'con_song')      meta.push('<span class="vien-nho song">Còn sống</span>');
  else if(p.trang_thai === 'chua_ro')  meta.push('<span class="vien-nho chua-ro">Chưa rõ</span>');

  const khoiDS = (tieu, ids) => {
    if(!ids || !ids.length) return '';
    return '<div class="khoi"><div class="khoi-tieu">'+tieu+'</div><div class="ds-lien">'+
      ids.map(x=>{
        const nx = N[x]; if(!nx) return '';
        const nam = nx.sinh?.match(/\d{4}/)?.[0];
        return '<div><a class="lien" onclick="moNguoi(\''+x+'\')">'+esc(nx.ten)+'</a>'+
               (nam?' <span class="thieu">('+nam+')</span>':'')+'</div>';
      }).join('')+'</div></div>';
  };

  const hang = (nhan, gtri) =>
    '<div class="hang"><div class="hang-nhan">'+nhan+'</div><div>'+
    (gtri || '<span class="thieu">chưa rõ</span>')+'</div></div>';

  // Dong ngay mat / tinh trang. Noi dung THAT su biet, khong suy dien.
  function hangMat(p){
    const tt = p.trang_thai || 'con_song';

    if(p.mat){
      const coNgay = /\d{1,2}\/\d{1,2}\//.test(p.mat);
      return hang(coNgay ? 'Ngày giỗ' : 'Năm mất',
                  '<span class="ngay-gio">'+esc(p.mat)+'</span>');
    }

    if(tt === 'da_mat'){
      // Doi <= 11: chac chan da khuat, nhung khong ai ghi lai ngay.
      // Noi ro la KHONG BIET, thay vi de trong cho nguoi doc tu suy.
      return hang('Ngày mất',
        '<span class="vien-nho mat">Đã mất</span> '+
        '<span class="thieu">— không rõ ngày, không có trong gia phả</span>');
    }

    if(tt === 'chua_ro'){
      return hang('Tình trạng',
        '<span class="vien-nho chua-ro">Chưa rõ</span> '+
        '<span class="thieu">— gia phả không ghi ngày mất</span>');
    }

    return hang('Tình trạng', '<span class="vien-nho song">Còn sống</span>');
  }

  const chaMe = [];
  if(p.cha && N[p.cha]) chaMe.push('<div><a class="lien" onclick="moNguoi(\''+p.cha+'\')">'+esc(N[p.cha].ten)+'</a> <span class="thieu">— cha</span></div>');
  if(p.me  && N[p.me])  chaMe.push('<div><a class="lien" onclick="moNguoi(\''+p.me+'\')">'+esc(N[p.me].ten)+'</a> <span class="thieu">— mẹ</span></div>');

  $('#man-ca-nhan').innerHTML =
    '<button class="quay-lai" onclick="location.hash=\'\'">← Về danh sách</button>'+

    '<div class="duong-doi">'+duong+'</div>'+

    '<div class="hs-dau">'+
      '<div>'+
        '<div class="hs-ten">'+esc(p.ten)+'</div>'+
        '<div class="hs-meta">'+meta.join('')+'</div>'+
      '</div>'+
    '</div>'+

    '<div class="khoi">'+
      '<div class="khoi-tieu">Thân thế</div>'+
      hang(p.trang_thai === 'da_mat' ? 'Ngày sinh' : 'Năm sinh',
           p.sinh ? esc(p.sinh) : '')+
      hang('Nơi sinh', p.noi_sinh ? esc(p.noi_sinh) : '')+
      hangMat(p)+
    '</div>'+

    (chaMe.length
      ? '<div class="khoi"><div class="khoi-tieu">Cha mẹ</div><div class="ds-lien">'+chaMe.join('')+'</div></div>'
      : '<div class="khoi"><div class="khoi-tieu">Cha mẹ</div><div class="thieu">Không có trong gia phả</div></div>')+

    khoiDS(p.gioi==='M' ? 'Vợ' : p.gioi==='F' ? 'Chồng' : 'Vợ / chồng', p.vo_chong)+
    khoiDS('Con — '+p.con.length+' người', p.con)+
    khoiDS('Anh chị em — '+p.anh_em.length+' người', p.anh_em);
}

// nút sơ đồ cây (Topola)
// handleCors=false: goi thang file, khong qua CORS proxy cua Topola
// (proxy do dang chet -> 'Failed to fetch'). GitHub Pages tu gui header CORS.
$('#mo-so-do').onclick = e=>{
  e.preventDefault();
  const u = location.href.split('#')[0].replace(/[^/]*$/,'') + 'giapha.ged';
  window.open(
    'https://pewu.github.io/topola-viewer/#/view?url=' +
    encodeURIComponent(u) + '&handleCors=false',
    '_blank'
  );
};
</script>
